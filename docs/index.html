se dollar values are not both stated.\nApplies to deliverables: deviation-report.docx\n","passed":true,"evidence":"It states the individual acquisition cap values as $25.0 million in the term sheet and $20.0 million in the draft."},{"text":"[C-032] ISSUE_009: Correctly states both audit delivery deadlines\nPASS if the report specifically states that the annual audit delivery deadline is 120 days in the term sheet and 90 days in the credit agreement, showing a 30-day reduction. FAIL if the precise day counts are not both stated.\nApplies to deliverables: deviation-report.docx\n","passed":false,"evidence":"The report does not state both audit delivery deadlines of 120 days and 90 days."},{"text":"[C-033] ISSUE_010: Correctly states both DDTL availability periods\nPASS if the report specifically states that the DDTL availability period is 18 months in the term sheet and 12 months in the credit agreement (or references the corresponding end dates of approximately November 2026 vs. May 2026). FAIL if the precise durations or dates are not both stated.\nApplies to deliverables: deviation-report.docx\n","passed":false,"evidence":"The report does not state both DDTL availability periods of 18 months and 12 months."}],"weight":1,"verdict":"fail"}],"execution_status":"ok","duration_ms":146681,"token_usage":{"input":0,"output":0,"reasoning":0},"input":[{"role":"user","content":"You are completing an AgentV adaptation of Harvey LAB task `banking-finance/compare-credit-agreement-against-term-sheet`."}],"output":"@[assistant]:\n# deviation-report.docx\n\n## Prioritized deviation report: draft credit agreement vs. executed term sheet\n\nBelow is a borrower-side comparison of the draft credit agreement against the executed term sheet, prioritized by likely economic and control impact. Citations reference the supplied filenames and locators.\n\n---\n\n### 1) SOFR floor increased; revolver pricing grid appears less favorable\n**Severity:** High  \n**Borrower impact:** Negative / lender-favorable\n\n**Deviation**\n- The executed term sheet sets Term SOFR floor at **0.75%** for Term Loan A and DDTL, with revolver pricing stepping down to **SOFR + 3.50%** and **SOFR + 3.25%** at lower leverage levels.  \n  - Source: `documents/executed-term-sheet.docx`, Section 4.1; Section 4.2; Exhibit C\n- The draft sets a **1.00% SOFR floor** and shows only **two revolver tiers**: **3.75%** above **3.50:1.00 leverage** and **3.50%** below that.  \n  - Source: `documents/draft-credit-agreement.docx`, Section 2.08(a); Section 1.01 definition of SOFR\n\n**Why it matters**\n- The higher SOFR floor is economically adverse even if headline margin is unchanged.\n- The apparent omission of the third, more favorable revolver tier may reduce pricing benefits at lower leverage.\n\n**Borrower recommendation**\n- Restore the **0.75% SOFR floor**.\n- Confirm whether the missing **3.25% revolver tier** was intended; if not, reinstate the full term-sheet grid.\n\n---\n\n### 2) CapEx flexibility tightened; carryforward removed\n**Severity:** High  \n**Borrower impact:** Negative\n\n**Deviation**\n- The term sheet provides a **$12.0 million annual CapEx cap** with **25% one-year carryforward**.  \n  - Source: `documents/executed-term-sheet.docx`, Sections 8–11; Section 9.3\n- The draft sets CapEx at **$10.5 million annually** and includes **no carryforward**.  \n  - Source: `documents/draft-credit-agreement.docx`, Sections 7.10–7.11\n\n**Why it matters**\n- This materially reduces operating flexibility and tightens the borrower’s capex basket.\n\n**Borrower recommendation**\n- Restore the **$12.0 million** CapEx cap.\n- Restore the **25% carryforward** mechanic.\n\n---\n\n### 3) Insurance/condemnation reinvestment period shortened\n**Severity:** High  \n**Borrower impact:** Negative\n\n**Deviation**\n- The term sheet allows a **270-day** reinvestment period for insurance/condemnation proceeds.  \n  - Source: `documents/executed-term-sheet.docx`, Sections 3.1, 10.1, 10.2, 10.4\n- The draft shortens that period to **180 days**.  \n  - Source: `documents/draft-credit-agreement.docx`, Sections 2.05(b)(ii), 2.05(b)(iv)\n\n**Why it matters**\n- A shorter window increases the likelihood of mandatory prepayment and reduces redeployment flexibility.\n\n**Borrower recommendation**\n- Restore the **270-day** reinvestment period.\n\n---\n\n### 4) Equity cure rights not reflected in the draft excerpt\n**Severity:** High  \n**Borrower impact:** Potentially negative if omitted\n\n**Deviation**\n- The term sheet includes **equity cure rights**: **2 per 4 quarters, 4 total**.  \n  - Source: `documents/executed-term-sheet.docx`, Sections 8–11; Section 11.4\n- The draft excerpt does **not show explicit equity cure rights** and states that financial covenant breaches are Events of Default with **no cure period**.  \n  - Source: `documents/draft-credit-agreement.docx`, Sections 7.10–7.11; Section 8.01(b)\n\n**Why it matters**\n- If omitted, this is a meaningful loss of borrower protection.\n\n**Borrower recommendation**\n- Confirm whether cure rights appear elsewhere in the draft.\n- If not, add the term-sheet equity cure construct.\n\n**Uncertainty note**\n- This is provisional because absence in the excerpt is not proof of absence in the full agreement.\n\n---\n\n### 5) Management fee basket reduced\n**Severity:** High  \n**Borrower impact:** Negative\n\n**Deviation**\n- The term sheet contemplates a **$1.5 million annual sponsor management fee**.  \n  - Source: `documents/executed-term-sheet.docx`, Sections 9.3–9.6\n- The draft allows management fees only up to **$1.0 million per year**.  \n  - Source: `documents/draft-credit-agreement.docx`, Sections 7.06–7.07\n\n**Why it matters**\n- This reduces sponsor payment flexibility and tightens the restricted payment basket.\n\n**Borrower recommendation**\n- Restore the **$1.5 million** annual fee basket.\n\n---\n\n### 6) Acquisition cap tightened\n**Severity:** High  \n**Borrower impact:** Negative\n\n**Deviation**\n- The term sheet allows a **$25.0 million individual acquisition cap**.  \n  - Source: `documents/executed-term-sheet.docx`, Sections 9.3–9.6\n- The draft lowers this to **$20.0 million per deal** and **$60.0 million aggregate**.  \n  - Source: `documents/draft-credit-agreement.docx`, Sections 7.02, 7.03, 7.05, 7.06, 7.10\n\n**Why it matters**\n- This narrows inorganic growth flexibility and may block transactions that would have been permitted under the term sheet.\n\n**Borrower recommendation**\n- Restore the **$25.0 million** per-deal cap.\n- Confirm whether the aggregate cap is intended and consistent with deal intent.\n\n---\n\n### 7) ECF threshold not preserved in the draft excerpt\n**Severity:** High  \n**Borrower impact:** Potentially negative\n\n**Deviation**\n- The term sheet includes a **$2.0 million Excess Cash Flow threshold**.  \n  - Source: `documents/executed-term-sheet.docx`, Sections 3.1, 10.1, 10.2, 10.4\n- The draft has **no ECF minimum threshold** in the provided summary.  \n  - Source: `documents/draft-credit-agreement.docx`, Sections 2.05–2.07\n\n**Why it matters**\n- Without a threshold, mandatory prepayment may apply to smaller amounts of cash generation, which is borrower-unfavorable.\n\n**Borrower recommendation**\n- Restore the **$2.0 million ECF threshold** if it is not present elsewhere.\n\n**Uncertainty note**\n- The full agreement should be checked to confirm whether the concept appears elsewhere.\n\n---\n\n### 8) Collateral package appears more detailed and potentially broader\n**Severity:** Medium-High  \n**Borrower impact:** Potentially negative\n\n**Deviation**\n- The term sheet contemplates first-priority liens on substantially all assets, 100% of domestic subsidiary equity, and real property collateral only above a **$2.5 million FMV threshold**, with customary exceptions.  \n  - Source: `documents/executed-term-sheet.docx`, Section 5\n- The draft requires all assets of Loan Parties as collateral, IP security agreements for n**Borrower impact:** Negative / closing-risk\n\n**Deviation**\n- The term sheet anticipates customary closing conditions with limited conditionality and a “certain funds” style framework.  \n  - Source: `documents/executed-term-sheet.docx`, Section 6\n- The draft includes executed loan documents, opinions, organizational documents, resolutions, financial statements, acquisition documents, pro forma compliance to **4.75x**, equity contributions, insurance, lien searches, UCC filings, collateral delivery, KYC/AML, solvency certificate, fees, **no MAE**, and absence of litigation, with subjective “reasonably satisfactory” standards.  \n  - Source: `documents/draft-credit-agreement.docx`, Section 3.01\n\n**Why it matters**\n- This is a materially more detailed and potentially lender-controlled closing condition set.\n\n**Borrower recommendation**\n- Narrow subjective standards.\n- Restore any agreed **certain-funds / limited conditionality** protections.\n\n---\n\n### 11) Material Adverse Effect default appears omitted from the draft excerpt\n**Severity:** Medium-High  \n**Borrower impact:** Potentially mixed, but likely borrower-favorable if truly omitted\n\n**Deviation**\n- The term sheet includes a **Material Adverse Effect EoD**.  \n  - Source: `documents/executed-term-sheet.docx`, Section 12\n- The draft excerpt lists payment, covenant, representation, cross-default, bankruptcy, judgment, ERISA, invalidity, change of control, and environmental defaults, but **no MAE-based EoD appears**.  \n  - Source: `documents/draft-credit-agreement.docx`, Section 8.01\n\n**Why it matters**\n- Removal of an MAE default would generally be borrower-favorable, but the excerpt may not capture all provisions.\n\n**Borrower recommendation**\n- Confirm whether MAE appears elsewhere in the draft.\n- If absent, preserve that omission unless other drafting restores equivalent clarity.\n\n**Uncertainty note**\n- Treat this as provisional because the draft source is excerpt-based.\n\n---\n\n### 12) Default and grace periods differ from the term sheet\n**Severity:** Medium  \n**Borrower impact:** Mixed, potentially negative\n\n**Deviation**\n- The term sheet provides:\n  - **5-business-day grace** for interest/fee payment defaults\n  - **30-day cure** for other covenant defaults\n  - **60-day** judgment default cure threshold\n  - Equity cure rights  \n  - Source: `documents/executed-term-sheet.docx`, Section 12\n- The draft provides a **3-business-day grace** for interest/fees and **30 days after notice** for other covenant defaults; no explicit equity cure rights are shown.  \n  - Source: `documents/draft-credit-agreement.docx`, Sections 8.01(a)–(c); 2.04(d); 5.02(c); 5.03\n\n**Why it matters**\n- Shortening payment grace periods is borrower-unfavorable.\n- The absence of clearly visible equity cure rights remains a significant gap.\n\n**Borrower recommendation**\n- Restore the **5-business-day** payment grace if not intentionally changed.\n- Confirm judgment default mechanics.\n- Add explicit equity cure rights if omitted.\n\n---\n\n### 13) Incremental facility added in the draft\n**Severity:** Medium  \n**Borrower impact:** Potentially positive\n\n**Deviation**\n- The term sheet excerpt does **not expressly reference** an incremental term loan facility.  \n  - Source: `documents/executed-term-sheet.docx` (no express incremental facility section identified in excerpts)\n- The draft permits up to **$40,000,000** of incremental term loans, subject to leverage compliance, MFN pricing protection for six months, same collateral/guaranty package, and agent/lender approval mechanics.  \n  - Source: `documents/draft-credit-agreement.docx`, Section 2.14\n- Lender counsel also referenced a **$40.0 million incremental facility** as one of the intended market adjustments.  \n  - Source: `documents/lender-counsel-transmittal.eml`, Email body\n\n**Why it matters**\n- This appears to be a borrower-friendly addition, though it comes with structural conditions.\n\n**Borrower recommendation**\n- Keep the incremental feature if commercially useful.\n- Confirm the consent, MFN, and leverage conditions are acceptable.\n\n---\n\n## Items that appear consistent or largely aligned\n\nThese are not priority deviations, but they help confirm the main deal economics:\n\n- **Headline facility size**: Both sources reflect a **$285.0 million** package with the same split of **$185.0 million TLA / $50.0 million revolver / $50.0 million DDTL**.  \n  - Sources: `documents/executed-term-sheet.docx`, Sections 2–3; `documents/draft-credit-agreement.docx`, Recitals; Schedule 2.01\n- **Fee rates**: Revolver commitment fee, DDTL ticking fee, and LC fronting fee appear to match in the excerpts.  \n  - Sources: `documents/executed-term-sheet.docx`, Section 4.3; Section 17; `documents/draft-credit-agreement.docx`, Section 2.09\n- **New York law / NYC forum**: Appears consistent.  \n  - Sources: `documents/executed-term-sheet.docx`, Section 16; `documents/draft-credit-agreement.docx`, Sections 10.13–10.15\n- **Leverage and FCCR tests**: The leverage step-downs and **1.20x FCCR** appear aligned in the excerpts.  \n  - Sources: `documents/executed-term-sheet.docx`, Sections 8–11; `documents/draft-credit-agreement.docx`, Sections 7.10–7.11\n\n---\n\n## Open questions / unresolved points\n\n1. **SOFR floor and revolver tiers**: Confirm the final pricing grid and whether the omitted revolver tier was intentional.\n2. **Equity cure rights**: Confirm whether these appear elsewhere in the draft or are omitted.\n3. **ECF threshold**: Confirm whether the **$2.0 million** threshold appears in a different section or defined term.\n4. **Collateral scope**: Confirm whether the draft broadens collateral obligations beyond the term sheet.\n5. **Guarantor carveouts**: Confirm whether immaterial/excluded subsidiary exceptions remain intact.\n6. **Certain funds / closing conditions**: Confirm whether the draft intentionally expands CPs beyond the term sheet.\n7. **MAE default**: Confirm whether the omission is real and whether related provisions compensate for it.\n8. **Incremental facility**: Confirm whether this was a negotiated addition and whether the MFN/consent mechanics are acceptable.\n\n---\n\n## Borrower-side priority recommendations\n\n1. Restore the **0.75% SOFR floor** and confirm the full revolver pricing tiers.\n2. Restore **CapEx flexibility** and carryforward.\n3. Restore the **270-day insurance/condemnation reinvestment window**.\n4. Confirm and, if missing, add **equity cure rights**.\n5. Restore the **$1.5 million management fee basket**.\n6. Restore the **$25.0 million acquisition cap**.\n7. Confirm or restore the **$2.0 million ECF threshold**.\n8. Narrow collateral, guaranty, and closing condition provisions to match the term sheet.\n9. Preserve the incremental facility if commercially desirable, but confirm its conditions.\n\n---\n\n## Final verification\n- Requested deliverable addressed: **deviation-report.docx**\n- Comparison performed between the **draft credit agreement** and **executed term sheet**\n- Deviations prioritized by likely borrower impact\n- Borrower-side recommendations included for each key deviation\n- Source filenames cited where feasible\n- Uncertainty explicitly noted where the record is excerpt-based or incomplete","assertions":[{"text":"[C-001] ISSUE_001: Identifies SOFR floor discrepancy\nPASS if the report identifies that the SOFR floor for the Term Loan A and/or DDTL differs between the term sheet (0.75% / 75 bps) and the draft credit agreement (1.00% / 100 bps). FAIL if this deviation is not identified.\nApplies to deliverables: deviation-report.docx\n","passed":true,"evidence":"The report identifies a SOFR floor mismatch: term sheet 0.75% vs draft 1.00%."},{"text":"[C-002] ISSUE_001: Correctly states both SOFR floor values\nPASS if the report specifically states that the term sheet SOFR floor is 0.75% (or 75 bps) and the credit agreement SOFR floor is 1.00% (or 100 bps), showing everage Ratio is below 3.00x. FAIL if the missing tier is not precisely described.\nApplies to deliverables: deviation-report.docx\n","passed":false,"evidence":"It does not precisely describe the omitted tier as SOFR + 325 bps when leverage is below 3.00x."},{"text":"[C-007] ISSUE_003: Identifies reduced CapEx cap\nPASS if the report identifies that the annual capital expenditure cap was reduced from $12.0 million (term sheet) to $10.5 million (credit agreement). FAIL if this reduction is not identified.\nApplies to deliverables: deviation-report.docx\n","passed":true,"evidence":"The report identifies the CapEx cap reduction from $12.0 million to $10.5 million."},{"text":"[C-008] ISSUE_003: Identifies elimination of CapEx carryforward\nPASS if the report identifies that the term sheet provides for a 25% carryforward of unused CapEx amounts to the following fiscal year but the credit agreement contains no carryforward provision. FAIL if the missing carryforward is not identified.\nApplies to deliverables: deviation-report.docx\n","passed":true,"evidence":"It states the term sheet has 25% carryforward and the draft has none."},{"text":"[C-009] ISSUE_004: Identifies omitted ECF sweep minimum threshold\nPASS if the report identifies that the term sheet includes a $2.0 million minimum ECF threshold (below which no sweep applies) but the credit agreement omits this threshold entirely. FAIL if this omission is not identified.\nApplies to deliverables: deviation-report.docx\n","passed":false,"evidence":"The report mentions an omitted ECF threshold but does not clearly state that the term sheet threshold is $2.0 million and the draft omits it entirely in a direct planted-issue format."},{"text":"[C-010] ISSUE_004: Notes impact of missing ECF threshold\nPASS if the report explains that without the $2.0 million minimum threshold, even de minimis amounts of excess cash flow would trigger mandatory prepayment, creating administrative burden and reducing borrower flexibility. FAI e,"evidence":"At least the SOFR floor discrepancy is classified as High severity."},{"text":"[C-026] Each deviation includes side-by-side term sheet vs. credit agreement comparison\nPASS if for the majority of identified deviations (at least 8 out of the 12 planted issues), the report states the term sheet provision and the credit agreement provision side by side or in a clear comparative format. FAIL if the report generally describes deviations without providing the specific terms from both documents.\nApplies to deliverables: deviation-report.docx\n","passed":true,"evidence":"For more than 8 deviations, the report presents term sheet and draft terms side by side with citations."},{"text":"[C-027] Each deviation includes a recommendation or course of action\nPASS if for the majority of identified deviations (at least 8 of those found), the report includes a specific recommendation (e.g., request conforming change, negotiate alternative, accept with modification). FAIL if recommendations are generally absent or only provided for a small minority of deviations.\nApplies to deliverables: deviation-report.docx\n","passed":true,"evidence":"Most deviations include explicit borrower-side recommendations or courses of action."},{"text":"[C-028] Report identifies deviations as lender-favorable / adverse to Borrower\nPASS if, for at least half of the identified deviations, the report states or indicates that the credit agreement term is more restrictive, narrower, or otherwise less favorable to the Borrower compared to the term sheet. FAIL if the report does not indicate the direction of deviations relative to the Borrower, or characterizes lender-favorable changes as borrower-favorable.\nApplies to deliverables: deviation-report.docx\n","passed":true,"evidence":"The report repeatedly characterizes the draft terms as lender-favorable, negative, tighter, or more restrictive to the borrower."},{"text":"[C-029] Report notes transmittal email's characterization as misleading\nPA                 </thead>
                <tbody>
                  ${EVAL_GROUPS.map((group) => `
                    <tr>
                      <td class="id-cell">${escapeHtml(group.name)}</td>
                      <td>${renderPassRate(group.stats.pass_rate)}</td>
                      <td class="table-num text-pass">${escapeHtml(String(group.stats.passed))}</td>
                      <td class="table-num text-fail">${escapeHtml(String(group.stats.failed))}</td>
                      <td class="table-num text-warn">${escapeHtml(String(group.stats.errors))}</td>
                      <td class="table-num">${escapeHtml(String(group.stats.total))}</td>
                      <td class="table-num">${escapeHtml(formatDuration(group.stats.total_duration_ms))}</td>
                      <td class="table-num">${escapeHtml(formatTokens(group.stats.total_tokens))}</td>
                      ${HAS_ANY_COST ? `<td class="table-num">${escapeHtml(formatCost(group.stats.total_cost_usd))}</td>` : ''}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>
        `);

        if (TARGET_GROUPS.length > 1) {
          overviewSections.push(`
            <section class="section">
              <div class="section-heading">
                <div>
                  <h2>Targets</h2>
                  <p>Cross-target summary for the loaded result set.</p>
                </div>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Target</th>
                    <th>Pass rate</th>
                      <th class="table-num">Passed</th>
                      <th class="table-num">Failed</th>
                      <th class="table-num">Errors</th>
                      <th class="table-num">Avg score</th>
                      <th class="table-num">Duration</th>
                      <th class="table-num">Tokens</th>
                      ${HAS_ANY_COST ? '<th class="table-num">Cost</th>' : ''}
                    </tr>
                  </thead>
                  <tbody>
                    ${TARGET_GROUPS.map((group) => {
                      const gradedRows = group.rows.filter((row) => statusOf(row) !== 'error');
                      const avgScore = gradedRows.length > 0
                        ? gradedRows.reduce((sum, row) => sum + row.score, 0) / gradedRows.length
                        : 0;
                      return `
                        <tr>
                          <td class="id-cell">${escapeHtml(group.name)}</td>
                      <td>${renderPassRate(group.stats.pass_rate)}</td>
                          <td class="table-num text-pass">${escapeHtml(String(group.stats.passed))}</td>
                          <td class="table-num text-fail">${escapeHtml(String(group.stats.failed))}</td>
                          <td class="table-num text-warn">${escapeHtml(String(group.stats.errors))}</td>
                          <td class="table-num ${toneForScore(avgScore)}">${escapeHtml(formatPercent(avgScore))}</td>
                          <td class="table-num">${escapeHtml(formatDuration(group.stats.total_duration_ms))}</td>
                          <td class="table-num">${escapeHtml(formatTokens(group.stats.total_tokens))}</td>
                          ${HAS_ANY_COST ? `<td class="table-num">${escapeHtml(formatCost(group.stats.total_cost_usd))}</td>` : ''}
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </section>
          `);
        }

        if (OVERALL_STATS.scores.length > 0) {
          const buckets = [0, 0, 0, 0, 0];
          OVERALL_STATS.scores.forEach((score) => {
            const index = Math.min(Math.floor(score * 5), 4);
            buckets[index] += 1;
          });
          const maxBucket = Math.max.apply(null, buckets);
          const labels = ['0-20%', '20-40%', '40-60%', '60-80%', '80-100%'];
          overviewSections.push(`
            <section class="section">
              <div class="section-heading">
                <div>
                  <h2>Score Distribution</h2>
                  <p>Histogram across all non-error result rows.</p>
                </div>
              </div>
              <div class="histogram">
                ${buckets.map((count, index) => `
                  <div class="hist-row">
                    <div class="hist-label">${labels[index]}</div>
                    <div class="hist-bar-track">
                      <div class="hist-bar-fill" style="width:${maxBucket > 0 ? (count / maxBucket) * 100 : 0}%"></div>
                    </div>
                    <div class="hist-count tabular">${count}</div>
                  </div>
                `).join('')}
              </div>
            </section>
          `);
        }

        APP.innerHTML = overviewSections.join('');
      }

      function renderSortableHeader(label, col) {
        const arrow = STATE.sort.col === col ? (STATE.sort.dir === 'asc' ? ' ↑' : ' ↓') : '';
        return `<th class="sortable" data-sort="${escapeHtml(col)}">${escapeHtml(label)}${arrow}</th>`;
      }

      function renderTestGroups() {
        const filteredRows = filterRows(DATA, STATE.filter);
        const filteredGroups = groupBy(filteredRows, 'eval_file').sort((a, b) => a.name.localeCompare(b.name));
        const hasMultipleTargets = TARGETS.length > 1;
        const hasCriteria = DATA.some((row) => extractCriteria(row).length > 0);
        if (filteredRows.length === 0) {
          return '<div class="empty-state"><h2>No matching tests</h2><p>Adjust the filters or search text.</p></div>';
        }

        const colCount = 4 + (hasCriteria ? 1 : 0) + (hasMultipleTargets ? 1 : 0) + (HAS_ANY_COST ? 1 : 0);

        return `
          <div class="group-list">
            ${filteredGroups.map((group) => {
              const sortedRows = sortRows(group.rows, STATE.sort);
              const groupSummary = [];
              groupSummary.push(`${group.stats.passed}/${group.stats.total} passed`);
              if (group.stats.failed > 0) groupSummary.push(`${group.stats.failed} failed`);
              if (group.stats.errors > 0) groupSummary.push(`${group.stats.errors} errors`);
              return `
                <section class="group-card">
                  <div class="group-header">
                    <div class="group-title-wrap">
                      <h2 class="group-title">${escapeHtml(group.name)}</h2>
                      <p class="group-subtitle">${escapeHtml(groupSummary.join(' | '))}</p>
                    </div>
                    <div class="group-metrics">
                      <div class="metric">
                        <span class="metric-label">Pass rate</span>
                        <span class="metric-value">${escapeHtml(formatPercent(group.stats.pass_rate))}</span>
                      </div>
                      <div class="metric">
                        <span class="metric-label">Tests</span>
                        <span class="metric-value">${escapeHtml(String(group.stats.total))}</span>
                      </div>
                      <div class="metric">
                        <span class="metric-label">Duration</span>
                        <span class="metric-value">${escapeHtml(formatDuration(group.stats.total_duration_ms))}</span>
                      </div>
                    </div>
                  </div>
                  <div class="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th class="expand-cell"></th>
                          ${renderSortableHeader('Test ID', 'test_id')}
                          ${hasCriteria ? '<th>Criteria</th>' : ''}
                          ${hasMultipleTargets ? renderSortableHeader('Target', 'target') : ''}
                          ${renderSortableHeader('Score', 'score')}
                          ${renderSortableHeader('Result', 'status')}
                          ${HAS_ANY_COST ? renderSortableHeader('Cost', 'cost_usd') : ''}
                        </tr>
                      </thead>
                      <tbody>
                        ${sortedRows.map((row) => {
                          const expanded = Boolean(STATE.expanded[row._key]);
                          const criteria = extractCriteria(row);
                          return `
                            <tr class="test-row" data-expand="${escapeHtml(row._key)}">
                              <td class="expand-cell">${expanded ? '\u25BE' : '\u25B8'}</td>
                              <td class="id-cell">${escapeHtml(row.test_id)}</td>
                              ${hasCriteria ? `<td class="criteria-cell">${escapeHtml(criteria)}</td>` : ''}
                              ${hasMultipleTargets ? `<td class="table-muted">${escapeHtml(row.target)}</td>` : ''}
                              <td class="table-num ${toneForScore(row.score)}">${escapeHtml(formatPercent(row.score))}</td>
                              <td>${renderStatusPill(statusOf(row))}</td>
                              ${HAS_ANY_COST ? `<td class="table-num">${escapeHtml(formatCost(row.cost_usd))}</td>` : ''}
                            </tr>
                            ${expanded ? `<tr class="detail-row"><td colspan="${colCount}">${renderDetail(row, EVALUATOR_NAMES, HAS_ANY_COST)}</td></tr>` : ''}
                          `;
                        }).join('')}
                      </tbody>
                    </table>
                  </div>
                </section>
              `;
            }).join('')}
          </div>
        `;
      }

      function bindTestEvents() {
        const statusInput = document.getElementById('filter-status');
        const targetInput = document.getElementById('filter-target');
        const searchInput = document.getElementById('filter-search');
        const sortableHeaders = Array.from(document.querySelectorAll('[data-sort]'));
        const expandableRows = Array.from(document.querySelectorAll('[data-expand]'));

        if (statusInput) {
          statusInput.value = STATE.filter.status;
          statusInput.addEventListener('change', (event) => {
            STATE.filter.status = event.target.value;
            render();
          });
        }

        if (targetInput) {
          targetInput.value = STATE.filter.target;
          targetInput.addEventListener('change', (event) => {
            STATE.filter.target = event.target.value;
            render();
          });
        }

        if (searchInput) {
          searchInput.value = STATE.filter.search;
          searchInput.addEventListener('input', (event) => {
            STATE.filter.search = event.target.value;
            render();
          });
        }

        sortableHeaders.forEach((header) => {
          header.addEventListener('click', () => {
            const col = header.getAttribute('data-sort');
            if (STATE.sort.col === col) {
              STATE.sort.dir = STATE.sort.dir === 'asc' ? 'desc' : 'asc';
            } else {
              STATE.sort.col = col;
              STATE.sort.dir = 'asc';
            }
            render();
          });
        });

        expandableRows.forEach((row) => {
          row.addEventListener('click', () => {
            const key = row.getAttribute('data-expand');
            STATE.expanded[key] = !STATE.expanded[key];
            render();
          });
        });
      }

      function renderTests() {
        const filteredRows = filterRows(DATA, STATE.filter);
        APP.innerHTML = `
          <section class="section">
            <div class="section-heading">
              <div>
                <h2>Test Cases</h2>
                <p>Grouped by source eval file with assertion type badges carried down from parent score entries.</p>
              </div>
            </div>
            <div class="filter-bar">
              <select class="filter-select" id="filter-status" aria-label="Filter by status">
                <option value="all">All status</option>
                <option value="pass">Passed</option>
                <option value="fail">Failed</option>
                <option value="error">Errors</option>
              </select>
              ${TARGETS.length > 1 ? `
                <select class="filter-select" id="filter-target" aria-label="Filter by target">
                  <option value="all">All targets</option>
                  ${TARGETS.map((target) => `<option value="${escapeHtml(target)}">${escapeHtml(target)}</option>`).join('')}
                </select>
              ` : ''}
              <input class="filter-input" id="filter-search" type="search" placeholder="Search test IDs, targets, eval files, or assertion text">
              <span class="filter-count">${escapeHtml(String(filteredRows.length))} of ${escapeHtml(String(DATA.length))} tests</span>
            </div>
            ${renderTestGroups()}
          </section>
        `;
        bindTestEvents();
      }

      const IS_SMALL = DATA.length <= 20;
      const TAB_NAV = document.getElementById('tab-nav');

      function render() {
        if (IS_SMALL) {
          TAB_NAV.classList.add('hidden');
          renderSinglePage();
        } else {
          TAB_NAV.classList.remove('hidden');
          if (STATE.tab === 'overview') renderOverview();
          else renderTests();
        }
      }

      function renderSinglePage() {
        if (DATA.length === 0) {
          APP.innerHTML = `
            <div class="empty-state">
              <h2>No results loaded</h2>
              <p>Add one or more parsed JSONL result rows to the template placeholder.</p>
            </div>
          `;
          return;
        }

        const sections = [];
        sections.push(`
          <section class="section">
            <div class="stats-grid">
              ${renderStatCard('Total tests', String(OVERALL_STATS.total))}
              ${renderStatCard('Passed', String(OVERALL_STATS.passed), 'tone-pass')}
              ${renderStatCard('Failed', String(OVERALL_STATS.failed), OVERALL_STATS.failed > 0 ? 'tone-fail' : '')}
              ${renderStatCard('Pass rate', formatPercent(OVERALL_STATS.pass_rate), toneClassForRate(OVERALL_STATS.pass_rate))}
              ${renderStatCard('Duration', formatDuration(OVERALL_STATS.total_duration_ms))}
              ${HAS_ANY_COST ? renderStatCard('Cost', formatCost(OVERALL_STATS.total_cost_usd)) : ''}
            </div>
          </section>
        `);

        sections.push(`
          <section class="section">
            <div class="filter-bar">
              <select class="filter-select" id="filter-status" aria-label="Filter by status">
                <option value="all">All status</option>
                <option value="pass">Passed</option>
                <option value="fail">Failed</option>
                <option value="error">Errors</option>
              </select>
              <input class="filter-input" id="filter-search" type="search" placeholder="Search test IDs, targets, or assertion text">
            </div>
            ${renderTestGroups()}
          </section>
        `);

        APP.innerHTML = sections.join('');
        bindTestEvents();
      }

      syncHeaderMeta();
      render();
    })();
  </script>
</body>
</html>
